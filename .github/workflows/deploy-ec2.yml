name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-backend-ec2
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run frontend lint
        run: npm run frontend:lint

      - name: Run frontend tests
        run: npm run frontend:test

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.1

      - name: Run backend tests
        run: npm run backend:test

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Deploy backend on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -eu

            cd /home/ubuntu/real-estate/backend

            git fetch origin main
            git reset --hard origin/main

            docker compose --env-file .env up -d --build redis backend
            docker compose ps

            curl --fail --silent --show-error https://real-estate-dev.duckdns.org/api/v1/probe/liveness
