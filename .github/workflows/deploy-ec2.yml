name: Deploy Backend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 13.50.108.221
          username: ubuntu
          key: ${{ secrets.DEPLOYEC2 }}
          script: |
            cd /home/ubuntu/developement/real-estate

            git fetch origin main
            git reset --hard origin/main

            docker compose up -d --build --force-recreate backend

            docker compose ps
            docker logs --tail=100 real-estate-backend