services:
  redis:
    image: redis:7-alpine
    container_name: real-estate-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: real-estate-backend
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://real-estate-2.c9gkm8cm4ufs.eu-north-1.rds.amazonaws.com:3306/${MYSQL_DATABASE:-real_estate}
      DB_USERNAME: ${MYSQL_USER:-admin}
      DB_PASSWORD: ${MYSQL_PASSWORD:-estate161027!}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-must-be-at-least-32-characters-long}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:-https://real-estate-devs.vercel.app}
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"

volumes:
  redis-data:
