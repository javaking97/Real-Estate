buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'org.springframework.boot:spring-boot-gradle-plugin:3.5.11'
        classpath 'io.spring.gradle:dependency-management-plugin:1.1.7'
    }
}

apply plugin: 'java'
apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'

group = 'kr.co.realestate'
version = '0.0.1-SNAPSHOT'
description = 'Real-estate backend service'

ext {
    mybatisSpringBootVersion = '3.0.5'
    mybatisDynamicSqlVersion = '1.5.2'
    mybatisGeneratorVersion = '1.4.2'
    mapstructVersion = '1.5.5.Final'
    lombokMapstructBindingVersion = '0.2.0'
    jjwtVersion = '0.12.6'
    springdocVersion = '2.8.17'
    log4jdbcVersion = '1.16'
    mybatisConfigDir = 'real-estate'
    mybatisConfigSubdir = 'user'
    mybatisConfigFile = 'genConfig_real_estate_user.xml'
    mybatisGeneratorConfigurationFile = "src/main/resources/mybatis-gen-configs/${mybatisConfigDir}/${mybatisConfigSubdir}/${mybatisConfigFile}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    mockitoAgent
    mybatisGenerator
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation "org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4.1:${log4jdbcVersion}"

    implementation "org.mybatis.spring.boot:mybatis-spring-boot-starter:${mybatisSpringBootVersion}"
    implementation "org.mybatis.dynamic-sql:mybatis-dynamic-sql:${mybatisDynamicSqlVersion}"
    mybatisGenerator "org.mybatis.generator:mybatis-generator-core:${mybatisGeneratorVersion}"
    mybatisGenerator 'com.mysql:mysql-connector-j'

    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    implementation "org.mapstruct:mapstruct:${mapstructVersion}"

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor "org.projectlombok:lombok-mapstruct-binding:${lombokMapstructBindingVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
    annotationProcessor 'org.projectlombok:lombok'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor "org.projectlombok:lombok-mapstruct-binding:${lombokMapstructBindingVersion}"
    testAnnotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'

    mockitoAgent('org.mockito:mockito-core') {
        transitive = false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-parameters']
}

tasks.named('test') {
    useJUnitPlatform()
    doFirst {
        jvmArgs += "-javaagent:${configurations.mockitoAgent.singleFile.absolutePath}"
    }
}

tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}

tasks.register('mbg', JavaExec) {
    group = 'mybatis'
    description = 'Generate MyBatis Dynamic SQL model, mapper, and support files from the local database schema.'
    mainClass = 'org.mybatis.generator.api.ShellRunner'
    classpath = configurations.mybatisGenerator
    args = [
            '-configfile', mybatisGeneratorConfigurationFile,
            '-overwrite',
            '-verbose'
    ]

    doFirst {
        def generatorProperties = file("src/main/resources/mybatis-gen-configs/${mybatisConfigDir}/generator.properties")
        if (!generatorProperties.exists()) {
            throw new GradleException("Create ${generatorProperties} from generator.properties.example before running ./gradlew mbg")
        }
    }
}
